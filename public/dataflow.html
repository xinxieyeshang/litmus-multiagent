<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LITMUS Data Flow Diagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;padding:40px 20px}
.container{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:28px;font-weight:600;color:#1a1a2e;margin-bottom:8px;letter-spacing:-0.5px}
.subtitle{text-align:center;font-size:14px;color:#666;margin-bottom:40px}
svg{display:block;margin:0 auto}
</style>
</head>
<body>
<div class="container">
<h1>LITMUS Data Flow</h1>
<p class="subtitle">From Raw Data to Innovation Index</p>
<svg viewBox="0 0 1100 720" width="1100" height="720">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
</marker>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
</linearGradient>
<linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
</linearGradient>
<linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#fce7f3"/><stop offset="100%" stop-color="#fbcfe8"/>
</linearGradient>
<linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/>
</linearGradient>
<linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#fde047"/>
</linearGradient>
<filter id="shadow">
<feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
</filter>
</defs>

<!-- Layer 1: Data Input -->
<text x="550" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">DATA INPUT</text>

<!-- Paper Corpus -->
<rect x="180" y="50" width="300" height="100" rx="12" fill="url(#g1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="330" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Paper Corpus</text>
<text x="330" y="95" text-anchor="middle" font-size="11" fill="#78716c">~3,100 Biomedical Papers</text>
<text x="330" y="115" text-anchor="middle" font-size="10" fill="#a8a29e">PMID | Title | Abstract | MeSH Terms</text>
<text x="330" y="135" text-anchor="middle" font-size="10" fill="#a8a29e">Full-text (optional)</text>

<!-- H1 Labels -->
<rect x="620" y="50" width="300" height="100" rx="12" fill="url(#g6)" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
<text x="770" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">F1000Prime H1 Labels</text>
<text x="770" y="95" text-anchor="middle" font-size="11" fill="#78716c">Expert Ground Truth</text>
<text x="770" y="115" text-anchor="middle" font-size="10" fill="#a8a29e">PMID | Classification (H1/H2/H3)</text>
<text x="770" y="135" text-anchor="middle" font-size="10" fill="#a8a29e">Rating | Recommendation Level</text>

<!-- PMID Match Arrow -->
<path d="M 480 100 L 620 100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="550" y="92" text-anchor="middle" font-size="9" fill="#64748b">PMID Match</text>

<!-- Arrow down from merged data -->
<path d="M 550 150 L 550 190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Layer 2: Four Signals -->
<text x="550" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">FOUR SIGNALS COMPUTATION</text>

<!-- Signal 1 -->
<rect x="40" y="230" width="230" height="130" rx="10" fill="url(#g2)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="65" cy="255" r="12" fill="#3b82f6" opacity="0.2"/>
<text x="65" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">S1</text>
<text x="155" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">LLM Impact</text>
<text x="155" y="278" text-anchor="middle" font-size="10" fill="#3b82f6">5-Dimension Evaluation</text>
<line x1="60" y1="290" x2="250" y2="290" stroke="#93c5fd" stroke-width="0.5"/>
<text x="155" y="308" text-anchor="middle" font-size="9" fill="#64748b">Transformative | Broad Relevance</text>
<text x="155" y="322" text-anchor="middle" font-size="9" fill="#64748b">Methodological | Clinical Impact</text>
<text x="155" y="336" text-anchor="middle" font-size="9" fill="#64748b">Paradigm Challenge</text>
<text x="155" y="352" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">Score: [0, 1]</text>

<!-- Signal 2 -->
<rect x="300" y="230" width="230" height="130" rx="10" fill="url(#g3)" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="325" cy="255" r="12" fill="#22c55e" opacity="0.2"/>
<text x="325" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">S2</text>
<text x="415" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">MeSH Breadth</text>
<text x="415" y="278" text-anchor="middle" font-size="10" fill="#22c55e">Cross-Domain Coverage</text>
<line x1="320" y1="290" x2="510" y2="290" stroke="#86efac" stroke-width="0.5"/>
<text x="415" y="308" text-anchor="middle" font-size="9" fill="#64748b">MeSH API → Tree Numbers</text>
<text x="415" y="322" text-anchor="middle" font-size="9" fill="#64748b">8 Domains: A-Anatomy, B-Organisms</text>
<text x="415" y="336" text-anchor="middle" font-size="9" fill="#64748b">C-Diseases, D-Chemicals, E-Analytical</text>
<text x="415" y="352" text-anchor="middle" font-size="9" font-weight="500" fill="#166534">Score = Unique Domains / 8</text>

<!-- Signal 3 -->
<rect x="560" y="230" width="230" height="130" rx="10" fill="url(#g4)" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="585" cy="255" r="12" fill="#ec4899" opacity="0.2"/>
<text x="585" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">S3</text>
<text x="675" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">Knowledge Brokerage</text>
<text x="675" y="278" text-anchor="middle" font-size="10" fill="#ec4899">Network Betweenness</text>
<line x1="580" y1="290" x2="770" y2="290" stroke="#f9a8d4" stroke-width="0.5"/>
<text x="675" y="308" text-anchor="middle" font-size="9" fill="#64748b">TF-IDF + TextRank → Keywords</text>
<text x="675" y="322" text-anchor="middle" font-size="9" fill="#64748b">Bipartite Network Construction</text>
<text x="675" y="336" text-anchor="middle" font-size="9" fill="#64748b">Brandes Algorithm</text>
<text x="675" y="352" text-anchor="middle" font-size="9" font-weight="500" fill="#9d174d">Score: Betweenness ∈ [0, 1]</text>

<!-- Signal 4 -->
<rect x="820" y="230" width="230" height="130" rx="10" fill="url(#g5)" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
<circle cx="845" cy="255" r="12" fill="#6366f1" opacity="0.2"/>
<text x="845" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">S4</text>
<text x="935" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">Cognitive Deviation</text>
<text x="935" y="278" text-anchor="middle" font-size="10" fill="#6366f1">Novelty Measurement</text>
<line x1="840" y1="290" x2="1030" y2="290" stroke="#a5b4fc" stroke-width="0.5"/>
<text x="935" y="308" text-anchor="middle" font-size="9" fill="#64748b">Semantic Deviation (Embedding)</text>
<text x="935" y="322" text-anchor="middle" font-size="9" fill="#64748b">Concept Frequency (Low-freq MeSH)</text>
<text x="935" y="336" text-anchor="middle" font-size="9" fill="#64748b">S4 = 0.5×Dev + 0.5×Freq</text>
<text x="935" y="352" text-anchor="middle" font-size="9" font-weight="500" fill="#4338ca">Score: [0, 1]</text>

<!-- Arrows from input to signals -->
<path d="M 550 190 L 155 230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)" opacity="0.6"/>
<path d="M 550 190 L 415 230" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-blue)" opacity="0.6"/>
<path d="M 550 190 L 675 230" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-blue)" opacity="0.6"/>
<path d="M 550 190 L 935 230" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)" opacity="0.6"/>

<!-- Arrows down from signals to fusion -->
<path d="M 155 360 L 155 410 L 450 410" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 415 360 L 415 410 L 500 410" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 675 360 L 675 410 L 600 410" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 935 360 L 935 410 L 650 410" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<!-- Layer 3: Score Fusion -->
<text x="550" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">SCORE FUSION</text>

<rect x="250" y="455" width="600" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
<text x="550" y="480" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Weighted Linear Fusion</text>

<!-- Formula -->
<text x="550" y="505" text-anchor="middle" font-size="12" fill="#475569" font-family="monospace">FusedScore = (w₁×S₁ + w₂×S₂ + w₃×S₃ + w₄×S₄) / Σw</text>

<!-- Weights -->
<rect x="320" y="520" width="80" height="22" rx="4" fill="#dbeafe"/>
<text x="360" y="535" text-anchor="middle" font-size="10" font-weight="500" fill="#1e40af">w₁ = 0.50</text>
<rect x="420" y="520" width="80" height="22" rx="4" fill="#dcfce7"/>
<text x="460" y="535" text-anchor="middle" font-size="10" font-weight="500" fill="#166534">w₂ = 0.30</text>
<rect x="520" y="520" width="80" height="22" rx="4" fill="#fce7f3"/>
<text x="560" y="535" text-anchor="middle" font-size="10" font-weight="500" fill="#9d174d">w₃ = 0.05</text>
<rect x="620" y="520" width="80" height="22" rx="4" fill="#e0e7ff"/>
<text x="660" y="535" text-anchor="middle" font-size="10" font-weight="500" fill="#4338ca">w₄ = 0.15</text>

<!-- Arrow down to validation -->
<path d="M 550 555 L 550 590" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Layer 4: Validation -->
<text x="550" y="615" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">VALIDATION & EVALUATION</text>

<rect x="200" y="630" width="700" height="80" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
<text x="550" y="655" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Compare with F1000Prime H1 Labels (Ground Truth)</text>

<!-- Metrics -->
<rect x="250" y="670" width="120" height="28" rx="6" fill="#fee2e2"/>
<text x="310" y="688" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">AUC-ROC</text>
<rect x="390" y="670" width="120" height="28" rx="6" fill="#fee2e2"/>
<text x="450" y="688" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Precision@K</text>
<rect x="530" y="670" width="120" height="28" rx="6" fill="#fee2e2"/>
<text x="590" y="688" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Cohen's d</text>
<rect x="670" y="670" width="120" height="28" rx="6" fill="#fee2e2"/>
<text x="730" y="688" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">Lift Curve</text>

<!-- H1 Labels connection -->
<path d="M 770 150 L 770 670 L 790 670" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" opacity="0.5"/>
<text x="800" y="400" font-size="9" fill="#ef4444" transform="rotate(90, 800, 400)">Ground Truth</text>

</svg>
</div>
</body>
</html>
